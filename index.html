<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #8B0000, #FF006E);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: 'Josefin Sans', sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .logo-container {
            text-align: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        #logo {
            width: 200px;
            height: auto;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .fade-out { 
            display: none !important; 
        }

        .links-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 40px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .link-title {
            font-size: 32px;
            color: white;
            text-decoration: none;
            transition: transform 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .link-title:hover {
            transform: scale(1.05);
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            font-family: 'Josefin Sans', sans-serif;
        }

        .modal h3 {
            color: #8B0000;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .modal p {
            color: #333;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.3s ease;
            font-family: 'Josefin Sans', sans-serif;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        .confirm-btn {
            background: #8B0000;
            color: white;
        }

        .cancel-btn {
            background: #ccc;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="logo-container" id="logoContainer">
        <img id="logo" src="Logo.png" alt="Logo">
    </div>

    <div class="links-container" id="linksContainer">
        <!-- 1. Will Your Waifu Escape (Has Modal) -->
        <a href="#" onclick="openModal('Will Your Waifu Escape', 'https://katamata.itch.io/will-your-waifu-escape')" class="link-title">
            Will Your Waifu Escape
        </a>

        <!-- 2. Tardiness Girl (Direct Link) -->
        <a href="https://store.steampowered.com/app/3929050/Tardiness_Girl/" target="_blank" class="link-title">
            Tardiness Girl
        </a>

        <!-- 3. Midnight Yakiniku at Campsite (Direct Link) -->
        <a href="https://katamata.itch.io/midnight-yakiniku-at-campsite" target="_blank" class="link-title">
            Midnight Yakiniku at Campsite
        </a>
    </div>

    <!-- Modal for Adult Content -->
    <div class="modal-overlay" id="adultModal">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button class="modal-btn confirm-btn" onclick="confirmEntry()">Yes, I'm ready</button>
                <button class="modal-btn cancel-btn" onclick="closeModal()">No, not yet</button>
            </div>
        </div>
    </div>

    <script>
        const logoContainer = document.getElementById('logoContainer');
        const linksContainer = document.getElementById('linksContainer');
        const adultModal = document.getElementById('adultModal');
        let isLinksVisible = false;
        let currentGame = '';
        let currentUrl = '';

        function showLinks() {
            if (isLinksVisible) return;
            logoContainer.classList.add('fade-out');
            linksContainer.style.display = 'flex';
            isLinksVisible = true;
        }

        function openModal(gameName, url) {
            currentGame = gameName;
            currentUrl = url;
            
            document.getElementById('modalTitle').textContent = `Warning`;
            document.getElementById('modalMessage').innerHTML = 
                'This content may contain adult themes. Are you sure you want to proceed?';
            
            adultModal.style.display = 'flex';
        }

        function closeModal() {
            adultModal.style.display = 'none';
        }

        function confirmEntry() {
            adultModal.style.display = 'none';
            window.location.href = currentUrl;
        }

        adultModal.addEventListener('click', (e) => {
            if (e.target === adultModal) {
                closeModal();
            }
        });

        logoContainer.addEventListener('click', showLinks);
    </script>
</body>
</html>
